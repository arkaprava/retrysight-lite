name: Release Desktop Apps

on:
  # Pushing a v* tag builds all platforms and publishes (R2 + GitHub Release).
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux-x64
          - win-x64
          - macos-arm64
      deploy:
        description: 'Also publish (R2 upload + GitHub Release). Requires target=all and a v* tag as the ref.'
        required: false
        default: false
        type: boolean

jobs:
  build-linux:
    if: >-
      ${{ github.event_name == 'push' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'linux-x64' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            manager/package-lock.json
      - run: npm ci && npm run install:app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Build self-contained Linux app
        run: npm run dist:app:linux
      - uses: actions/upload-artifact@v4
        with:
          name: retrysight-lite-app-linux-x64
          path: |
            release/app-linux-x64/**
            release/retrysight-lite-*-linux-x64.tar.gz
            release/retrysight-lite-app-linux-x64.tar.gz
            release/manifest.json
            release/cdn-staging/**

  build-windows:
    if: >-
      ${{ github.event_name == 'push' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'win-x64' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            manager/package-lock.json
      - run: npm ci && npm run install:app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build self-contained Windows app
        run: npm run dist:app:win
      - uses: actions/upload-artifact@v4
        with:
          name: retrysight-lite-app-win-x64
          path: |
            release/app-win-x64/**
            release/retrysight-lite-*-win-x64.zip
            release/retrysight-lite-app-win-x64.zip
            release/manifest.json
            release/cdn-staging/**

  build-macos:
    if: >-
      ${{ github.event_name == 'push' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'macos-arm64' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            manager/package-lock.json
      - run: npm ci && npm run install:app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build self-contained macOS app
        run: npm run dist:app:mac
      - uses: actions/upload-artifact@v4
        with:
          name: retrysight-lite-app-macos-arm64
          path: |
            release/app-macos-arm64/**
            release/retrysight-lite-*-macos-arm64.dmg
            release/retrysight-lite-app-macos-arm64.tar.gz
            release/manifest.json
            release/cdn-staging/**

  publish:
    needs: [build-linux, build-windows, build-macos]
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') &&
          (github.event_name == 'push' ||
           (github.event.inputs.deploy == 'true' && github.event.inputs.target == 'all')) }}
    runs-on: ubuntu-latest
    # Create a "release" environment in repo settings and add required
    # reviewers to gate the live CDN upload behind a manual approval.
    environment: release
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WEBSITE_REPO_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF does not match package.json version v$VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN (R2 write) and CLOUDFLARE_ACCOUNT_ID repo secrets"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release/_artifacts

      - name: Collect installers
        run: |
          find release/_artifacts -maxdepth 2 -type f \
            \( -name 'retrysight-lite-*.dmg' -o -name 'retrysight-lite-*.tar.gz' -o -name 'retrysight-lite-*.zip' \) \
            -exec cp {} release/ \;
          for f in "retrysight-lite-$VERSION-macos-arm64.dmg" \
                   "retrysight-lite-$VERSION-linux-x64.tar.gz" \
                   "retrysight-lite-$VERSION-win-x64.zip"; do
            test -f "release/$f" || { echo "::error::missing $f"; exit 1; }
          done
          ls -la release

      - name: Generate combined manifest and CDN staging
        run: npm run stage:cdn

      - name: Upload to Cloudflare R2
        run: node scripts/upload-r2.mjs

      # Read back through the authenticated R2 API: the public hostname is
      # behind Cloudflare bot protection and returns 403 to runner traffic.
      - name: Verify uploaded manifest
        run: |
          LIVE=$(npx --yes wrangler@4 r2 object get "download-retrysight/lite/latest/manifest.json" --remote --pipe | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          echo "latest manifest version: $LIVE"
          [ "$LIVE" = "$VERSION" ] || { echo "::error::latest manifest is $LIVE, expected $VERSION"; exit 1; }

      - name: Create GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping"
          else
            gh release create "$GITHUB_REF_NAME" --title "RetrySight Lite $VERSION" --generate-notes \
              "release/retrysight-lite-$VERSION-macos-arm64.dmg" \
              "release/retrysight-lite-$VERSION-linux-x64.tar.gz" \
              "release/retrysight-lite-$VERSION-win-x64.zip" \
              release/manifest.json
          fi

      # Opens (never merges) a PR on the website repo. Needs a token with
      # contents + pull-requests write on that repo; skipped if unset.
      - name: Open website PR with new download links
        if: ${{ env.WEBSITE_REPO_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
        run: |
          SITE_REPO="${{ github.repository_owner }}/retrysight-website"
          gh repo clone "$SITE_REPO" site
          cd site
          git checkout -b "release/lite-v$VERSION"
          node ../scripts/update-website-downloads.mjs src/data/site.ts "$VERSION"
          if git diff --quiet; then echo "Website already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Lite download links to v$VERSION"
          git push origin "release/lite-v$VERSION"
          gh pr create --repo "$SITE_REPO" --base main --head "release/lite-v$VERSION" \
            --title "Update Lite download links to v$VERSION" \
            --body "Automated by the release workflow after v$VERSION was published to app.retrysight.com. Review and merge to update the site."
